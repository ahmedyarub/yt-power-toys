<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; padding: 8px 12px; }
    label { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 10px 0; }
    input[type=number] { width: 80px; }
    #status { margin-top: 14px; padding: 8px 10px; border-radius: 6px; background: rgba(128, 128, 128, 0.15); }
    #status.blocked { background: rgba(217, 48, 37, 0.2); }
    #status.error { background: rgba(249, 171, 0, 0.25); }
  </style>
</head>
<body>
  <label>Block YouTube when the Windows volume is above (%) <input type="number" id="limitPercent" min="0" max="100" step="1"></label>
  <label>Resume playback when the volume goes back down <input type="checkbox" id="autoResume"></label>
  <div id="status">Connecting…</div>
  <script src="options.js"></script>
</body>
</html>
