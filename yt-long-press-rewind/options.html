<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; padding: 8px 12px; }
    label { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 10px 0; }
    input { width: 80px; }
  </style>
</head>
<body>
  <label>Rewind zone (left % of the player) <input type="number" id="zonePercent" min="5" max="100" step="1"></label>
  <label>Hold time before rewinding (ms) <input type="number" id="holdMs" min="100" max="2000" step="50"></label>
  <label>Rewind speed (x) <input type="number" id="speed" min="1" max="20" step="0.5"></label>
  <script src="options.js"></script>
</body>
</html>
